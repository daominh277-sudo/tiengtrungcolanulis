  dialogues:[
    {label:"Bài khoá 1", situation:"Trên đường, Lý Văn đang tìm nhà hàng, Vương Nhất Phi gọi điện cho anh.",
     lines:[
       {s:"Vương Nhất Phi",cn:"喂，李文，你什么时候能到饭店？",py:"Wèi, Lǐ Wén, nǐ shénme shíhou néng dào fàndiàn?"},

       {s:"Vương Nhất Phi",cn:"是的。你开车没开车？",py:"Shì de. Nǐ kāichē méi kāichē?"},
       {s:"Lý Văn",cn:"我没开车，坐车呢。",py:"Wǒ méi kāichē, zuò chē ne."}
     ], vi:"Vương Nhất Phi: A lô Lý Văn, khi nào bạn đến được nhà hàng?\nLý Văn: Chưa biết, đang tìm đây. Nó có phải ở sau siêu thị không?\nVương Nhất Phi: Đúng vậy. Bạn có lái xe không?\nLý Văn: Mình không lái xe, đang đi xe (khách) đây."},

       {s:"Vương Nhất Phi",cn:"你们学习忙不忙？",py:"Nǐmen xuéxí máng bu máng?"},
       {s:"Lý Văn",cn:"非常忙，我学医，我们的课很多。",py:"Fēicháng máng, wǒ xué yī, wǒmen de kè hěn duō."}
     ], vi:"Vương Nhất Phi: Bạn vẫn đang học đại học à?\nLý Văn: Vâng, mình đang học đại học, vẫn là sinh viên.\nVương Nhất Phi: Việc học có bận không?\nLý Văn: Bận lắm, mình học ngành y, tụi mình học nhiều lớp lắm."},
    {label:"Bài khoá 3", situation:"Sáng thứ 7, Lưu Minh chuẩn bị đi làm thêm ở bệnh viện, nói chuyện với con gái trước khi đi.",

       {s:"Lưu Minh",cn:"弟弟起床没起床呢？",py:"Dìdi qǐchuáng méi qǐchuáng ne?"},
       {s:"Lưu Tiểu Tuyết",cn:"没起床呢，还在睡觉。",py:"Méi qǐchuáng ne, hái zài shuìjiào."},
       {s:"Lưu Minh",cn:"还睡呢？他今天去不去那里？",py:"Hái shuì ne? Tā jīntiān qù bu qù nàlǐ?"},

  grammar:[
    {title:"Câu hỏi chính phản", vi:"Cấu trúc: \"x+不/没+x\", trong đó \"x\" là động từ hoặc tính từ. Với động từ dùng \"不/没\", với tính từ dùng \"不\".", examples:["它是不是在超市后边？","你去没去学校？","这件衣服好看不好看？"]},
    {title:"Phó từ thời gian \"在/正在\"", vi:"Đặt trước động từ, biểu thị hành động đang diễn ra hoặc tình huống đang tiếp diễn. Có 2 dạng: (1) 在/正在+động từ; (2) 在/正在+động từ+呢. Ngoài ra còn dạng thứ 3: động từ+呢. Trả lời phủ định dùng \"没(有)\".", examples:["你还在读大学吗？","学生们在/正在上课呢。","我们读书呢。"]},

function renderVocab(l){
 let h=`<div class="section-title">Từ vựng (${l.vocab.length}) · Nhấn “Nét” để xem thứ tự viết chữ Hán</div><table class="vocab-table"><tbody>`;
 h+=l.vocab.map((v,i)=>`<tr><td class="v-cn hanzi">${esc(v.cn)}</td><td class="v-py">${esc(v.pinyin)}</td><td class="v-pos">${esc(v.pos)}</td><td>${esc(v.vi)}</td><td class="stroke-cell"><div class="stroke-wrap"><div class="stroke" id="stroke-${l.id}-${i}">${Array.from(v.cn).map((ch,j)=>`<div class="stroke-char"><span id="stroke-${l.id}-${i}-${j}" style="display:inline-block;width:48px;height:48px"></span><span class="stroke-label">${esc(ch)}</span></div>`).join('')}</div><button data-stroke="${l.id}-${i}">Nét ✍️</button><div class="stroke-order-panel" id="stroke-order-${l.id}-${i}"></div></div></td></tr>`).join('');
 h+='</tbody></table>'; if(l.properNouns?.length)h+=`<div class="card"><div class="section-title">Danh từ riêng</div>${l.properNouns.map(p=>`<span class="chip" style="display:inline-block;margin:4px"><b class="hanzi">${esc(p.cn)}</b> · ${esc(p.pinyin)} · ${esc(p.vi)}</span>`).join('')}</div>`; return h;
}
function renderDialogue(l){
 return l.dialogues.map((d,i)=>`<div class="dialogue"><div class="dialogue-head"><span class="label">${esc(d.label)}</span><button class="audio-btn" data-audio="${i}">▶ Phát bài khoá</button></div><div class="note" style="margin:10px 0 14px">📍 ${esc(d.situation)}</div>${d.lines.map(line=>`<div class="line"><div class="speaker">${esc(line.s)}</div><div class="bubble"><div class="line-cn hanzi">${esc(line.cn)}</div><div class="line-py">${esc(line.py)}</div><button class="audio-btn line-audio" data-text="${esc(line.cn)}">🔊 Nghe câu</button></div></div>`).join('')}<button class="translate-btn" data-trans="${i}">Xem bản dịch ▾</button><div class="translation" id="trans-${l.id}-${i}">${esc(d.vi)}</div></div>`).join('');
}
function renderGrammar(l){if(!l.grammar.length)return `<div class="card">Bài này tập trung vào từ vựng và giao tiếp cơ bản.</div>`;return l.grammar.map(g=>`<div class="card grammar"><h3 class="hanzi">${esc(g.title)}</h3><p>${esc(g.vi)}</p><div>${g.examples.map(e=>`<span class="example">${esc(e)}</span>`).join('')}</div></div>`).join('')}
function renderFlash(l){const v=l.vocab[state.flashIndex%l.vocab.length];return `<div class="flash"><div class="flashcard ${state.flipped?'flipped':''}" id="flashcard"><div class="flash-inner"><div class="face front"><div class="big hanzi">${esc(v.cn)}</div><div class="note">Nhấn để lật</div></div><div class="face back"><div class="py">${esc(v.pinyin)}</div><div class="vi">${esc(v.vi)}</div><div>${esc(v.pos)}</div></div></div></div><div class="flash-controls"><button class="small-btn" id="prev">← Trước</button><span>${state.flashIndex+1}/${l.vocab.length}</span><button class="small-btn" id="next">Sau →</button></div></div>`}
function chunksFor(sentence,l){let s=sentence.replace(/[，。！？、,.!?]/g,'');let words=[...(l.vocab||[]).map(v=>v.cn), '你好','大家','我们','你们','他们','她们','它们','是的','不客气','对不起','没关系','非常','有点儿','一些','这儿','那儿','哪里','哪儿','一个','两个','一个人'];words=[...new Set(words)].sort((a,b)=>b.length-a.length);let out=[];while(s){let w=words.find(x=>s.startsWith(x));if(w){out.push(w);s=s.slice(w.length)}else{out.push(s[0]);s=s.slice(1)}}return out}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeExercises(l){
 const vocab=shuffle(l.vocab).slice(0,3); const meanings=vocab.map(v=>v.vi); 
 const mcq=vocab.map((v,i)=>({q:`Từ “${v.cn}” có nghĩa là gì?`,options:shuffle([v.vi,...shuffle(l.vocab.filter(x=>x.cn!==v.cn)).slice(0,3).map(x=>x.vi)]),a:v.vi}));
 const fill=(l.exercises||[]).flatMap(ex=>ex.type==='fill'?ex.items:[]).slice(0,2);
 const sentenceLines=l.dialogues.flatMap(d=>d.lines).filter(x=>x.cn&&x.cn.length>=5).slice(0,2);
 const reorder=sentenceLines.map(x=>({q:x.cn,parts:chunksFor(x.cn,l),a:chunksFor(x.cn,l)}));
 const match=vocab.map(v=>({word:v.cn,a:v.vi,opts:shuffle(meanings)}));
 const tf=vocab.map((v,i)=>({q:`“${v.cn}” nghĩa là “${v.vi}”.`,a:true})).concat([{q:`“${l.vocab[0].cn}” nghĩa là “${l.vocab[1].vi}”.`,a:false}]).slice(0,3);
 const situations=l.dialogues.slice(0,2).map(d=>{const correct=d.lines[0].cn;const others=l.dialogues.flatMap(x=>x.lines).map(x=>x.cn).filter(x=>x!==correct);return {s:d.situation,q:'Trong tình huống này, câu nào phù hợp nhất?',options:shuffle([correct,...shuffle(others).slice(0,2)]),a:correct}});
 return {mcq,fill,reorder,match,tf,situations};
}
function renderExercises(l){
 const ex=makeExercises(l); const counts={mcq:0,fill:0,reorder:0,match:0,tf:0,sit:0}; let h=`<div class="student-box"><div class="section-title">Thông tin học sinh — bắt buộc trước khi nộp bài</div><div class="student-grid"><div class="field"><label>Họ và tên</label><input id="studentName" placeholder="Nguyễn Văn A"></div><div class="field"><label>Lớp</label><input id="studentClass" placeholder="12A1"></div></div><p class="note">Kết quả được lưu trên trình duyệt và có thể xuất thành file để gửi cho giáo viên. Không cần nhập thông tin nhạy cảm.</p></div>`;
 function type(title,icon,items,render){if(!items.length)return'';return `<div class="card"><div class="type-badge">${icon} ${title}</div>${items.map((it,i)=>render(it,i)).join('')}</div>`}
 h+=type('Trắc nghiệm','📝',ex.mcq,(it,i)=>{let id=`mcq-${i}`;return `<div class="q">${i+1}. ${esc(it.q)}</div><div class="options">${it.options.map(o=>`<label class="option"><input type="radio" name="${id}" value="${esc(o)}"> <span>${esc(o)}</span></label>`).join('')}</div>`});
 h+=type('Điền từ','✍️',ex.fill,(it,i)=>`<div class="q">${i+1}. ${esc(it.q)}</div><input class="answer-input" id="fill-${i}" placeholder="Nhập đáp án">`);
 h+=type('Sắp xếp câu','🔀',ex.reorder,(it,i)=>{let id=`ord-${i}`;return `<div class="q">${i+1}. Sắp xếp thành câu đúng: <span class="note">(nhấn từng mảnh theo thứ tự)</span></div><div class="reorder" id="${id}-pool">${shuffle(it.parts).map((p,j)=>`<button class="word-btn" data-order="${id}" data-value="${esc(p)}">${esc(p)}</button>`).join('')}</div><div class="chosen hanzi" id="${id}-chosen"></div><button class="small-btn" data-reset="${id}">↺ Làm lại</button>`});
 h+=type('Nối từ','🔗',ex.match,(it,i)=>`<div class="match-row"><div class="match-word hanzi">${esc(it.word)}</div><select class="select match-select" data-match="${i}"><option value="">-- chọn nghĩa --</option>${it.opts.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select></div>`);
 h+=type('Đúng / Sai','✅',ex.tf,(it,i)=>`<div class="q">${i+1}. ${esc(it.q)}</div><div class="options"><label class="option"><input type="radio" name="tf-${i}" value="true"> Đúng</label><label class="option"><input type="radio" name="tf-${i}" value="false"> Sai</label></div>`);
 h+=type('Tình huống','💬',ex.situations,(it,i)=>`<div class="situation">📍 ${esc(it.s)}</div><div class="q">${i+1}. ${esc(it.q)}</div><div class="options">${it.options.map(o=>`<label class="option"><input type="radio" name="sit-${i}" value="${esc(o)}"> <span class="hanzi">${esc(o)}</span></label>`).join('')}</div>`);
 h+=`<div id="result" class="result"></div><div class="actions"><button class="primary" id="submitExam">Nộp bài & chấm điểm</button><button class="secondary" id="exportResult" style="display:none">Xuất kết quả JSON</button></div><p class="note">💡 Nếu học sinh dùng điện thoại/máy khác với giáo viên, hãy bấm “Xuất kết quả JSON” sau khi nộp và gửi file đó cho giáo viên.</p>`;
 window.__exercise=ex; return h;
}
function renderContent(){
 const l=getLesson(state.lessonId); const c=document.getElementById('content'); let h='';
 if(state.tab==='vocab')h=renderVocab(l); else if(state.tab==='dialogue')h=renderDialogue(l); else if(state.tab==='grammar')h=renderGrammar(l); else if(state.tab==='flashcard')h=renderFlash(l); else h=renderExercises(l);
 c.innerHTML=h+`<div class="footer">Tiếng Trung Cô Thu Lan Ulis · 0912 666 259 · Bài ${l.id}/15</div>`;
 if(state.tab==='exercise'){const n=localStorage.getItem('hsk1_student_name')||'',cl=localStorage.getItem('hsk1_student_class')||'';if(document.getElementById('studentName')){document.getElementById('studentName').value=n;document.getElementById('studentClass').value=cl;document.getElementById('studentName').oninput=e=>localStorage.setItem('hsk1_student_name',e.target.value);document.getElementById('studentClass').oninput=e=>localStorage.setItem('hsk1_student_class',e.target.value)}}
 wire(l);
}
function wire(l){
 document.querySelectorAll('.line-audio').forEach(b=>b.onclick=()=>speak(b.dataset.text));
 document.querySelectorAll('[data-audio]').forEach(b=>b.onclick=()=>speakDialogue(l.dialogues[+b.dataset.audio]));
 document.querySelectorAll('[data-trans]').forEach(b=>b.onclick=()=>{let e=document.getElementById(`trans-${l.id}-${b.dataset.trans}`);e.classList.toggle('show');b.textContent=e.classList.contains('show')?'Ẩn bản dịch ▴':'Xem bản dịch ▾'});
 if(state.tab==='flashcard'){document.getElementById('flashcard').onclick=()=>{state.flipped=!state.flipped;renderContent()};document.getElementById('prev').onclick=()=>{state.flashIndex=(state.flashIndex-1+l.vocab.length)%l.vocab.length;state.flipped=false;renderContent()};document.getElementById('next').onclick=()=>{state.flashIndex=(state.flashIndex+1)%l.vocab.length;state.flipped=false;renderContent()}}
 if(state.tab==='vocab'){
  document.querySelectorAll('[data-stroke]').forEach(b=>b.onclick=()=>{
   const [lid,i]=b.dataset.stroke.split('-');
   const l=getLesson(+lid), v=l.vocab[+i];
   const panel=document.getElementById(`stroke-order-${lid}-${i}`);
   if(!panel) return;
   panel.classList.toggle('show');
   if(!panel.classList.contains('show')) return;
   if(panel.dataset.ready==='1') return;
   panel.dataset.ready='1';

   const chars=Array.from(v.cn);
   panel.innerHTML=`<div class="stroke-order-title">📌 Hoạt hình thứ tự nét: “${esc(v.cn)}”</div>
     <div class="stroke-source">Nguồn SVG hoạt hình: Make Me A Hanzi · GitHub Raw. Dữ liệu SVG chứa sẵn trình tự nét, không dùng fetch/CDN.</div>
     <div class="stroke-char-list"></div>`;
   const list=panel.querySelector('.stroke-char-list');

   chars.forEach((ch,idx)=>{
    const uid=`stroke-anim-${lid}-${i}-${idx}`;
    const base=`stroke-step-${lid}-${i}-${idx}`;
    const row=document.createElement('div');
    row.style.marginBottom='18px';
    row.innerHTML=`
      <div class="stroke-sequence">
        <b class="hanzi">${esc(ch)}</b>
        · <b class="stroke-count" id="${uid}-count">SVG hoạt hình · Unicode ${ch.codePointAt(0)}</b>
      </div>
      <div class="stroke-animation-box">
        <div class="stroke-animation-canvas" id="${uid}">
          <img class="stroke-svg" alt="Thứ tự nét ${esc(ch)}" src="${strokeSvgUrl(ch)}"
               onerror="this.onerror=null;this.src='${strokeFallbackUrl(ch)}'" />
        </div>
        <div>
          <div class="stroke-current" id="${uid}-current">▶ Hoạt hình tự chạy <small>· chữ ${esc(ch)}</small></div>
          <div class="stroke-animation-controls">
            <button type="button" data-replay="${uid}">↻ Phát lại</button>
            <button type="button" data-open-svg="${uid}">↗ Mở nguồn SVG</button>
          </div>
          ${strokeHint(ch)?`<div class="stroke-note">Số nét tham khảo: <b>${strokeHint(ch)}</b>. Số nét hiển thị theo SVG chuẩn từ nguồn dữ liệu.</div>`:''}
        </div>
      </div>
      <div class="stroke-steps" id="${base}-steps"></div>`;
    list.appendChild(row);

    const img=row.querySelector('.stroke-svg');
    const current=row.querySelector(`#${uid}-current`);
    const replay=row.querySelector(`[data-replay="${uid}"]`);
    const openSvg=row.querySelector(`[data-open-svg="${uid}"]`);
    const steps=row.querySelector(`#${base}-steps`);

    const showSteps=(n)=>{
      steps.innerHTML='';
      if(!n) return;
      for(let k=1;k<=n;k++){
        const card=document.createElement('div');
        card.className='stroke-step';
        card.innerHTML=`<div class="stroke-step-num">Nét ${k}</div><div class="stroke-step-char hanzi">${esc(ch)}</div>`;
        card.title=`Thứ tự nét ${k}`;
        card.onclick=()=>{
          steps.querySelectorAll('.stroke-step').forEach(x=>x.classList.remove('active'));
          card.classList.add('active');
          current.innerHTML=`✍️ Thứ tự <small>· nét ${k}/${n}</small>`;
        };
        steps.appendChild(card);
      }
    };

    replay.onclick=()=>{
      const src=img.src;
      img.src='';
      requestAnimationFrame(()=>{img.src=src; current.innerHTML='▶ Đang phát lại <small>· hoạt hình SVG</small>';});
    };
    openSvg.onclick=()=>window.open(strokeSvgUrl(ch),'_blank','noopener');
    img.addEventListener('load',()=>{
      current.innerHTML='✅ Đã tải <small>· hoạt hình SVG đang chạy</small>';
      const n=strokeHint(ch); showSteps(n);
    });
    img.addEventListener('error',()=>{
      current.innerHTML='⚠️ Không tải được SVG này. Bạn có thể mở nguồn dự phòng trực tiếp.';
    });
   });
  });
 }
 if(state.tab==='exercise'){
  document.querySelectorAll('[data-order]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.order, chosen=document.getElementById(id+'-chosen');if(btn.classList.contains('used'))return;btn.classList.add('used');chosen.dataset.parts=(chosen.dataset.parts?chosen.dataset.parts+'|':'')+btn.dataset.value;chosen.textContent=chosen.dataset.parts.split('|').join(' ')});
  document.querySelectorAll('[data-reset]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.reset;document.querySelectorAll(`[data-order="${id}"]`).forEach(x=>x.classList.remove('used'));let e=document.getElementById(id+'-chosen');e.dataset.parts='';e.textContent=''});
  document.getElementById('submitExam').onclick=()=>grade(l);
 }
}
function grade(l){
 const ex=window.__exercise;let correct=0,total=0;
 ex.mcq.forEach((it,i)=>{total++;const v=document.querySelector(`input[name="mcq-${i}"]:checked`)?.value;if(norm(v)===norm(it.a))correct++});
 ex.fill.forEach((it,i)=>{total++;const v=document.getElementById(`fill-${i}`)?.value;if(norm(v)===norm(it.a))correct++});
 ex.reorder.forEach((it,i)=>{total++;const v=document.getElementById(`ord-${i}-chosen`)?.dataset.parts||'';if(norm(v.replace(/\|/g,' '))===norm(it.a.join(' ')))correct++});
 ex.match.forEach((it,i)=>{total++;const v=document.querySelector(`[data-match="${i}"]`)?.value;if(norm(v)===norm(it.a))correct++});
 ex.tf.forEach((it,i)=>{total++;const v=document.querySelector(`input[name="tf-${i}"]:checked`)?.value;if((v==='true')===it.a)correct++});
 ex.situations.forEach((it,i)=>{total++;const v=document.querySelector(`input[name="sit-${i}"]:checked`)?.value;if(norm(v)===norm(it.a))correct++});
 const name=document.getElementById('studentName').value.trim(), cls=document.getElementById('studentClass').value.trim();
 if(!name||!cls){alert('Vui lòng nhập Họ và tên và Lớp trước khi nộp bài.');return}
 const result={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),student:name,className:cls,lessonId:l.id,lesson:l.cn,score:correct,total,percent:Math.round(correct/total*100),submittedAt:new Date().toISOString()};
 const all=JSON.parse(localStorage.getItem('hsk1_results_v2')||'[]');all.push(result);localStorage.setItem('hsk1_results_v2',JSON.stringify(all));
 const box=document.getElementById('result');box.classList.add('show');box.innerHTML=`<div class="score">${result.score}/${result.total} · ${result.percent}%</div><div style="margin-top:6px">Đã ghi nhận kết quả của <b>${esc(name)}</b> · lớp <b>${esc(cls)}</b> · Bài ${l.id}.</div>`;
 document.getElementById('exportResult').style.display='inline-block';document.getElementById('exportResult').onclick=()=>downloadJSON(result,`ket-qua-${name.replace(/\s+/g,'-')}-bai-${l.id}.json`);
}
function downloadJSON(obj,filename){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function renderAll(){renderSidebar();renderHero();renderTabs();renderContent()}
document.getElementById('searchInput').oninput=e=>{state.search=e.target.value;renderSidebar()};
document.getElementById('menuToggle').onclick=()=>document.getElementById('sidebar').classList.toggle('collapsed');
if(innerWidth<=940)document.getElementById('sidebar').classList.add('collapsed');
renderAll();
</script></body></html>
